<style>
  @font-face {
    font-family: "Montserrat";
    src: url("/montserrat.woff") format("woff");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  body {
    background-color: #002E5D;
    background-image:
      radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.15) 2px, transparent 2px);
    background-size: 22px 22px, 60px 60px;
    background-attachment: fixed;
    color: #ffffff;
    position: relative;
    min-height: 88vh;
    max-width: 88%;
    width: 88%;
    margin: 0;
  }

  header {
    padding: 21px 0;
    position: relative;
    z-index: 2;
    text-align: center;
    background: transparent;
  }

  header .title {
    justify-content: center;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
  }

  header .title h2 {
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
  }

  main {
    background: rgba(0, 0, 0, 0.7);
    padding: 28px 52px 40px;
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    margin: 20px auto 0;
    position: relative;
    z-index: 1;
    width: min(80%, 80rem);
  }

  main::before {
    content: "";
    position: absolute;
    inset: -1px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: inherit;
    pointer-events: none;
  }

  footer {
    position: relative;
    z-index: 1;
  }

  .site-footer-license {
    font-size: 0.72rem;
    opacity: 0.85;
  }

  .x-embed {
    display: flex;
    justify-content: center;
    margin: 2.5rem 0;
  }

  h1 {
    font-size: 1.5em;
  }

  h2 {
    font-size: 1.3em;
    margin-top: 1.8em;
  }

  h3 {
    font-size: 1.1em;
  }

  .footnote-popup-host {
    position: relative;
  }

  .footnote-popup-host > a[data-footnote-popup] {
    display: inline;
    cursor: pointer;
  }

  .footnote-popover {
    display: none;
    position: fixed;
    left: 0;
    top: 0;
    bottom: auto;
    transform: none;
    width: min(24rem, calc(100vw - 1rem));
    max-height: calc(100dvh - 1rem);
    overflow-y: auto;
    overscroll-behavior: contain;
    overflow-wrap: anywhere;
    box-sizing: border-box;
    padding: 0.55rem 0.7rem;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 0.5rem;
    background: rgba(15, 15, 15, 0.96);
    color: #fff;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    font-size: 0.88rem;
    line-height: 1.35;
    text-align: left;
    z-index: 999;
  }

  .footnote-popup-host:hover .footnote-popover,
  .footnote-popup-host:focus-within .footnote-popover,
  .footnote-popup-host.is-open .footnote-popover {
    display: block;
  }

  .footnote-popover p {
    margin: 0;
  }

  .footnote-popover a {
    color: #FDDA24;
  }

  html.footnote-popovers-enabled .footnotes {
    display: none;
  }

  a { color: #FDDA24; }
  a:hover { color: #FDDA24; text-decoration: underline; }
  a:visited { color: #B7ACE8; }
  ul.blog-posts li a,
  ul.blog-posts li a:hover {
    color: #FDDA24;
  }
  ul.blog-posts li a:visited {
    color: #B7ACE8;
  }

  @media (max-width: 768px) {
    main {
      width: 100%;
      margin: 10px auto 0;
      padding: 24px 20px 32px;
      border-radius: 0;
    }
  }
</style>
<script>
  (function () {
    function initFootnotePopovers() {
      const refs = Array.from(document.querySelectorAll('sup a[href^="#fn:"]'));
      if (!refs.length) return;

      const hosts = [];
      const popovers = [];
      const positionPopover = (ref, popover) => {
        const viewport = window.visualViewport;
        const leftEdge = viewport ? viewport.offsetLeft : 0;
        const topEdge = viewport ? viewport.offsetTop : 0;
        const width = viewport ? viewport.width : window.innerWidth;
        const height = viewport ? viewport.height : window.innerHeight;
        const padding = 8;
        const gap = 8;
        const anchor = ref.getBoundingClientRect();

        // Measure the entire note before restricting it to the available vertical space.
        popover.style.maxWidth = `${Math.max(0, width - padding * 2)}px`;
        popover.style.maxHeight = `${Math.max(0, height - padding * 2)}px`;
        const noteHeight = popover.scrollHeight;
        const aboveRoom = Math.max(0, anchor.top - topEdge - gap - padding);
        const belowRoom = Math.max(0, topEdge + height - anchor.bottom - gap - padding);
        const showAbove = aboveRoom >= noteHeight ||
          (belowRoom < noteHeight && aboveRoom > belowRoom);
        popover.style.maxHeight = `${showAbove ? aboveRoom : belowRoom}px`;

        const bounds = popover.getBoundingClientRect();
        const left = Math.max(leftEdge + padding, Math.min(
          anchor.left + anchor.width / 2 - bounds.width / 2,
          leftEdge + width - padding - bounds.width
        ));
        popover.style.left = `${left}px`;
        popover.style.top = `${showAbove
          ? anchor.top - gap - bounds.height
          : anchor.bottom + gap}px`;
      };

      const closeAll = () => {
        hosts.forEach((host) => host.classList.remove('is-open'));
      };

      refs.forEach((ref) => {
        const targetId = ref.getAttribute('href');
        if (!targetId) return;

        const noteId = targetId.replace(/^#/, '');
        const note = document.getElementById(noteId);
        if (!note) return;

        const clone = note.cloneNode(true);
        clone.querySelectorAll('.footnote-backref').forEach((el) => el.remove());

        const popover = document.createElement('span');
        popover.className = 'footnote-popover';
        popover.innerHTML = clone.innerHTML.trim();

        const host = ref.parentElement;
        if (!host) return;
        host.classList.add('footnote-popup-host');
        hosts.push(host);
        popovers.push({ ref, popover });

        ref.setAttribute('data-footnote-popup', 'true');
        host.appendChild(popover);

        host.addEventListener('pointerenter', () => positionPopover(ref, popover));
        host.addEventListener('focusin', () => positionPopover(ref, popover));

        ref.addEventListener('click', function (event) {
          event.preventDefault();
          const willOpen = !host.classList.contains('is-open');
          closeAll();
          if (willOpen) {
            host.classList.add('is-open');
            positionPopover(ref, popover);
          }
        });
      });

      if (!hosts.length) return;

      const repositionVisible = () => {
        popovers.forEach(({ ref, popover }) => {
          if (popover.getClientRects().length) positionPopover(ref, popover);
        });
      };
      window.addEventListener('resize', repositionVisible);
      window.addEventListener('scroll', repositionVisible, true);
      window.visualViewport?.addEventListener('resize', repositionVisible);
      window.visualViewport?.addEventListener('scroll', repositionVisible);
      document.documentElement.classList.add('footnote-popovers-enabled');

      document.addEventListener('click', function (event) {
        if (event.target.closest('.footnote-popup-host')) return;
        closeAll();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeAll();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFootnotePopovers);
    } else {
      initFootnotePopovers();
    }
  })();
</script>
