name: 🌐 Build and deploy to ICP
run-name: 🚀 Deploy ICP site — ${{ github.event.pull_request.title || github.event_name }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icp-production
  cancel-in-progress: false

env:
  ICP_CLI_VERSION: "1.2.0"
  ICP_CLI_PLUGIN_COMPUTE_LIMIT_SECS: "300"
  ICX_ASSET_VERSION: "0.29.0"
  DO_NOT_TRACK: "1"

jobs:
  build-and-deploy:
    name: xlm-domains
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: ./scripts/build.sh --minify

      - name: Check deployment prerequisites
        if: github.event_name != 'pull_request'
        id: deployment
        shell: bash
        env:
          ICP_DEPLOYER_PEM: ${{ secrets.ICP_DEPLOYER_PEM }}
        run: |
          if [[ -z "${ICP_DEPLOYER_PEM}" ]]; then
            echo "ICP_DEPLOYER_PEM is not configured; build completed without deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ ! -f .icp/data/mappings/ic.ids.json ]]; then
            echo "The mainnet canister mapping is not committed; build completed without deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ICP CLI
        if: steps.deployment.outputs.ready == 'true'
        run: npm install --global "@icp-sdk/icp-cli@${ICP_CLI_VERSION}" @icp-sdk/ic-wasm

      - name: Install asset uploader
        if: steps.deployment.outputs.ready == 'true'
        run: |
          cargo install icx-asset \
            --version "${ICX_ASSET_VERSION}" \
            --locked \
            --root "${RUNNER_TEMP}/icx-asset"

      - name: Import deployment identity
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        env:
          ICP_DEPLOYER_PEM: ${{ secrets.ICP_DEPLOYER_PEM }}
          ICP_HOME: ${{ runner.temp }}/icp-home
        run: |
          key_file="${RUNNER_TEMP}/github-actions.pem"
          uploader_key_file="${RUNNER_TEMP}/github-actions-icx.pem"
          umask 077
          printf '%s' "${ICP_DEPLOYER_PEM}" > "${key_file}"
          icp identity import github-actions \
            --from-pem "${key_file}" \
            --storage plaintext
          openssl pkey \
            -in "${key_file}" \
            -traditional \
            -out "${uploader_key_file}"
          openssl pkey -in "${uploader_key_file}" -check -noout
          icp identity import github-actions-uploader \
            --from-pem "${uploader_key_file}" \
            --storage plaintext

          original_principal="$(icp identity principal --identity github-actions)"
          uploader_principal="$(icp identity principal --identity github-actions-uploader)"
          if [[ "${original_principal}" != "${uploader_principal}" ]]; then
            echo "The converted uploader key does not match the deployment identity." >&2
            exit 1
          fi

      - name: Verify deployment identity controls canister
        if: steps.deployment.outputs.ready == 'true'
        env:
          ICP_HOME: ${{ runner.temp }}/icp-home
        run: icp canister settings show frontend --identity github-actions -e ic --json

      - name: Grant asset upload permission
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        env:
          ICP_HOME: ${{ runner.temp }}/icp-home
        run: |
          uploader_principal="$(icp identity principal --identity github-actions)"
          icp canister call frontend grant_permission \
            "(record { to_principal = principal \"${uploader_principal}\"; permission = variant { Commit }; })" \
            --identity github-actions \
            -e ic

          permitted="$(icp canister call frontend list_permitted \
            '(record { permission = variant { Commit }; })' \
            --identity github-actions \
            --query \
            --output candid \
            -e ic)"
          if [[ "${permitted}" != *"${uploader_principal}"* ]]; then
            echo "The deployment identity was not granted Commit permission." >&2
            exit 1
          fi

      - name: Sync site to ICP
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          canister_id="$(jq --exit-status --raw-output '.frontend' .icp/data/mappings/ic.ids.json)"
          timeout --signal=TERM 15m "${RUNNER_TEMP}/icx-asset/bin/icx-asset" \
            --replica https://icp0.io \
            --pem "${RUNNER_TEMP}/github-actions-icx.pem" \
            --log-level debug \
            sync "${canister_id}" public

      - name: Remove deployment key
        if: always() && steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          for key_file in \
            "${RUNNER_TEMP}/github-actions.pem" \
            "${RUNNER_TEMP}/github-actions-icx.pem"
          do
            if [[ -f "${key_file}" ]]; then
              shred --remove "${key_file}"
            fi
          done
