name: 🌐 Build and deploy to ICP
run-name: 🚀 Deploy ICP site — ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icp-production
  cancel-in-progress: false

env:
  ICP_CLI_VERSION: "1.2.0"
  ICP_CLI_PLUGIN_COMPUTE_LIMIT_SECS: "300"
  DFX_VERSION: "0.29.2"
  DO_NOT_TRACK: "1"

jobs:
  build-and-deploy:
    name: xlm-domains
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: ./scripts/build.sh --minify

      - name: Check deployment prerequisites
        if: github.event_name != 'pull_request'
        id: deployment
        shell: bash
        env:
          ICP_DEPLOYER_PEM: ${{ secrets.ICP_DEPLOYER_PEM }}
        run: |
          if [[ -z "${ICP_DEPLOYER_PEM}" ]]; then
            echo "ICP_DEPLOYER_PEM is not configured; build completed without deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ ! -f .icp/data/mappings/ic.ids.json ]]; then
            echo "The mainnet canister mapping is not committed; build completed without deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ICP CLI
        if: steps.deployment.outputs.ready == 'true'
        run: npm install --global "@icp-sdk/icp-cli@${ICP_CLI_VERSION}" @icp-sdk/ic-wasm

      - name: Install DFX asset uploader
        if: steps.deployment.outputs.ready == 'true'
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: ${{ env.DFX_VERSION }}

      - name: Import deployment identity
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        env:
          ICP_DEPLOYER_PEM: ${{ secrets.ICP_DEPLOYER_PEM }}
          ICP_HOME: ${{ runner.temp }}/icp-home
        run: |
          key_file="${RUNNER_TEMP}/github-actions.pem"
          umask 077
          printf '%s' "${ICP_DEPLOYER_PEM}" > "${key_file}"
          icp identity import github-actions \
            --from-pem "${key_file}" \
            --storage plaintext

      - name: Verify deployment identity controls canister
        if: steps.deployment.outputs.ready == 'true'
        env:
          ICP_HOME: ${{ runner.temp }}/icp-home
        run: icp canister settings show frontend --identity github-actions -e ic --json

      - name: Sync site to ICP
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          canister_id="$(jq --exit-status --raw-output '.frontend' .icp/data/mappings/ic.ids.json)"
          timeout --signal=TERM 15m "$(dfx cache show)/icx-asset" \
            --replica https://icp0.io \
            --pem "${RUNNER_TEMP}/github-actions.pem" \
            --log-level debug \
            sync "${canister_id}" public

      - name: Remove deployment key
        if: always() && steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          key_file="${RUNNER_TEMP}/github-actions.pem"
          if [[ -f "${key_file}" ]]; then
            shred --remove "${key_file}"
          fi
